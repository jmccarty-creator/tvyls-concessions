.mast h1{font-family:"Barlow Condensed","Barlow",sans-serif;font-weight:700;
  font-size:clamp(34px,7vw,58px);line-height:.95;margin:0;text-transform:uppercase;
  letter-spacing:.02em;color:var(--white);text-wrap:balance}
.mast h1 em{font-style:normal;color:var(--gold)}
.mast p{margin:14px auto 0;max-width:60ch;color:var(--muted);font-size:16.5px}

.strip{background:var(--gold);color:var(--black);font-family:"Barlow Condensed","Barlow",sans-serif;
  font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:13px;
  padding:9px 12px;text-align:center;overflow:hidden;white-space:nowrap}
.strip i{font-style:normal;opacity:.45;padding:0 7px}

.bar{background:var(--panel);border-bottom:1px solid var(--line-2);padding:15px 0}
.bar .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.count{font-family:"Barlow Condensed","Barlow",sans-serif;font-size:15px;letter-spacing:.12em;
  text-transform:uppercase;font-weight:700;color:var(--muted)}
.count b{color:var(--gold);font-size:21px}
.meter{flex:1;min-width:170px;height:8px;border-radius:99px;background:#242424;overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .35s ease}

main{padding:30px 0 56px}
.note{background:var(--panel);border-left:4px solid var(--gold);border-radius:0 8px 8px 0;
  padding:15px 19px;margin:0 0 28px;font-size:15.5px;color:var(--muted)}
.note b{color:var(--white)}
.note.ro{border-left-color:#fff}

.week{background:var(--panel);border:1px solid var(--line-2);border-radius:12px;margin:0 0 20px;overflow:hidden}
.whead{background:var(--white);color:var(--black);padding:11px 20px;
  display:flex;gap:14px;flex-wrap:wrap;align-items:baseline;justify-content:space-between}
.wdate{font-family:"Barlow Condensed","Barlow",sans-serif;font-weight:700;font-size:23px;
  letter-spacing:.05em;text-transform:uppercase;line-height:1.1}
.wsub{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.72}
.shifts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-2)}
@media(max-width:900px){.shifts{grid-template-columns:repeat(2,1fr)}}
@media(max-width:580px){.shifts{grid-template-columns:1fr}}
.shift{background:var(--panel-2);padding:15px 16px 18px;display:flex;flex-direction:column;gap:9px}
.stime{font-family:"Barlow Condensed","Barlow",sans-serif;font-weight:700;font-size:17px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.slabel{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);
  font-weight:700;margin-top:-7px}
.team{font-family:"Barlow Condensed","Barlow",sans-serif;font-weight:700;font-size:29px;
  line-height:1;letter-spacing:.02em;text-transform:uppercase;color:var(--gold);margin:2px 0 2px}
.team em{font-style:normal;font-size:14px;color:var(--white);letter-spacing:.08em;
  padding-left:5px;vertical-align:2px}
ul.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.slots li{display:flex;align-items:center;gap:8px;min-height:36px;padding:6px 10px;border-radius:6px;
  border:1px dashed #3a3a3a;font-size:15px}
ul.slots li.taken{border-style:solid;border-color:var(--gold-dim);background:rgba(255,224,0,.07)}
.nm{font-weight:600;line-height:1.25;color:var(--white);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.open{color:var(--muted-2);font-style:italic;flex:1}
button{font:inherit;cursor:pointer}
.take{border:0;background:var(--gold);color:var(--black);
  font-family:"Barlow Condensed","Barlow",sans-serif;font-weight:700;font-size:15px;
  letter-spacing:.12em;text-transform:uppercase;padding:9px 12px;border-radius:6px;width:100%}
.take:hover{background:#fff}
.drop{border:0;background:transparent;color:var(--muted-2);font-size:19px;line-height:1;
  padding:2px 5px;border-radius:4px}
.drop:hover{color:var(--gold)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

form.add{display:flex;flex-direction:column;gap:7px}
form.add input{font:inherit;font-size:15px;padding:9px 11px;border-radius:6px;
  border:1px solid #3a3a3a;background:#0b0b0b;color:var(--white);width:100%}
form.add input::placeholder{color:var(--muted-2)}
form.add .row{display:flex;gap:7px}
form.add .row button{flex:1;padding:9px 10px;border-radius:6px;border:0;font-weight:700;font-size:14.5px}
form.add .ok{background:var(--gold);color:var(--black)}
form.add .no{background:transparent;color:var(--muted);border:1px solid #3a3a3a}

footer{background:var(--black);border-top:1px solid var(--line-2);color:var(--muted-2);
  padding:24px 0 34px;font-size:13.5px}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 30px;justify-content:space-between}
footer b{color:var(--gold);font-weight:700}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var API="/.netlify/functions/slots";
  var AG={Bice:"6U",Keister:"6U",Settles:"6U",Jones:"8U",McCarty:"8U",Wagner:"8U",
          Cartwright:"12U",Hartrum:"12U"};
  var SHIFTS=[
    {k:"setup",t:"2:15 – 3:00",l:"Setup + arrival"},
    {k:"early",t:"3:00 – 3:45",l:"First half"},
    {k:"late", t:"3:45 – 4:30",l:"Second half"},
    {k:"close",t:"4:30 – 5:15",l:"Rush + close"}
  ];
  var WEEKS=[
    {d:"Sat, September 12",off:"Bice",   a:{setup:"Jones",     early:"Settles",late:"Keister",close:"Jones"}},
    {d:"Sat, September 19",off:"Keister",a:{setup:"Cartwright",early:"Bice",   late:"Settles",close:"Cartwright"}},
    {d:"Sat, September 26",off:"Settles",a:{setup:"Hartrum",   early:"Keister",late:"Bice",   close:"Hartrum"}},
    {d:"Sat, October 3",   off:"Bice",   a:{setup:"McCarty",   early:"Keister",late:"Settles",close:"Jones"}},
    {d:"Sat, October 10",  off:"Keister",a:{setup:"Wagner",    early:"Settles",late:"Bice",   close:"Wagner"}},
    {d:"Sat, October 24",  off:"Settles",a:{setup:"McCarty",   early:"Bice",   late:"Keister",close:"McCarty"}}
  ];
  var CAP=3, TOTAL=WEEKS.length*SHIFTS.length*CAP;

  var state={slots:{}}, openKey=null, busy=false, status="loading";

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function key(w,s){return w+"-"+s;}
  function entries(k){return state.slots[k]||[];}
  function filled(){var n=0;for(var k in state.slots)n+=state.slots[k].length;return n;}

  function slotList(k){
    var e=entries(k), out="";
    for(var i=0;i<CAP;i++){
      if(e[i]){
        out+='<li class="taken"><span class="nm">'+esc(e[i].n)+'</span>'+
             '<button class="drop" data-drop="'+k+'" data-i="'+i+'" aria-label="Remove '+esc(e[i].n)+'">&times;</button>'+
             '</li>';
      } else out+='<li><span class="open">Open</span></li>';
    }
    return '<ul class="slots">'+out+'</ul>';
  }

  function shiftBlock(wi,sh,team){
    var k=key(wi,sh.k), full=entries(k).length>=CAP;
    var body='<div class="stime">'+sh.t+'</div><div class="slabel">'+sh.l+'</div>'+
             '<div class="team">'+esc(team)+' <em>'+AG[team]+'</em></div>'+slotList(k);
    if(status==="ready" && !full){
      if(openKey===k){
        body+='<form class="add" data-k="'+k+'">'+
              '<input name="n" placeholder="Name" autocomplete="name" required maxlength="60">'+
              '<div class="row"><button type="submit" class="ok"'+(busy?" disabled":"")+'>'+
              (busy?"Saving…":"Sign up")+'</button>'+
              '<button type="button" class="no" data-cancel="1">Cancel</button></div></form>';
      } else body+='<button class="take" data-take="'+k+'">Take a slot</button>';
    }
    return '<div class="shift">'+body+'</div>';
  }

  function weekCard(w,wi){
    var sh="";
    for(var i=0;i<SHIFTS.length;i++) sh+=shiftBlock(wi,SHIFTS[i],w.a[SHIFTS[i].k]);
    return '<section class="week"><div class="whead"><span class="wdate">'+esc(w.d)+'</span>'+
           '</div>'+
           '<div class="shifts">'+sh+'</div></section>';
  }

  function view(){
    var f=filled(), pct=Math.round(f/TOTAL*100);
    var weeks=""; for(var i=0;i<WEEKS.length;i++) weeks+=weekCard(WEEKS[i],i);
    var notice;
    if(status==="loading") notice='<div class="note">Loading the sign-up sheet…</div>';
    else if(status==="error") notice='<div class="note ro"><b>The sheet could not load.</b> '+
      'Check your connection and refresh. Nothing you type is lost — nothing has been saved yet.</div>';
    else notice='<div class="note"><b>How this works.</b> Pick any open slot, add your name, '+
      'and it saves for everyone. No shift here overlaps your own child’s game — setup and close '+
      'happen before and after play, and the two middle shifts belong to the 6U teams playing only one '+
      'game that day. Three people per shift.</div>';
    return ''+
    '<header class="mast"><div class="wrap"><div class="logo" role="img" aria-label="Tri-Valley Youth League Softball"></div>'+
      '<h1>Fall Ball <em>Concessions</em></h1>'+
      '<p>Six Saturdays. Every shift falls outside the time your own team is on the field, so you never '+
      'have to choose between helping out and watching your kid play.</p>'+
    '</div></header>'+
    '<div class="strip">Go Tri-Valley! <i>&#9733;</i> Swing Big <i>&#9733;</i> Home of the Scotties '+
      '<i>&#9733;</i> Go Tri-Valley! <i>&#9733;</i> Swing Big <i>&#9733;</i> Home of the Scotties</div>'+
    '<div class="bar"><div class="wrap">'+
      '<div class="count"><b>'+f+'</b> of '+TOTAL+' slots filled</div>'+
      '<div class="meter"><i style="width:'+pct+'%"></i></div>'+
    '</div></div>'+
    '<main><div class="wrap">'+notice+weeks+'</div></main>'+
    '<footer><div class="wrap"><span>Stand opens <b>2:15</b> and closes <b>5:15</b> each Saturday.</span>'+
    '<span>Questions? Text your head coach.</span></div></footer>';
  }

  function paint(){ document.getElementById("app").innerHTML=view(); }

  function apply(d){ if(d&&d.slots) state=d; status="ready"; }

  function load(){
    return fetch(API,{cache:"no-store"}).then(function(r){
      if(!r.ok) throw 0; return r.json();
    }).then(function(d){ apply(d); paint(); })
     .catch(function(){ status="error"; paint(); });
  }

  function send(body){
    busy=true; paint();
    return fetch(API,{method:"POST",headers:{"content-type":"application/json"},
                      body:JSON.stringify(body)})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(d){ busy=false; openKey=null; apply(d); paint(); })
      .catch(function(){ busy=false; paint();
        alert("That did not save. Check your connection and try once more."); });
  }

  document.addEventListener("click",function(ev){
    var t=ev.target.closest?ev.target.closest("[data-take],[data-drop],[data-cancel]"):null;
    if(!t||busy) return;
    if(t.hasAttribute("data-cancel")){ openKey=null; paint(); return; }
    if(t.hasAttribute("data-take")){ openKey=t.getAttribute("data-take"); paint();
      var f=document.querySelector("form.add input"); if(f) f.focus(); return; }
    if(t.hasAttribute("data-drop")){
      var k=t.getAttribute("data-drop"), i=+t.getAttribute("data-i"), e=entries(k);
      if(!e[i]) return;
      if(!confirm("Remove "+e[i].n+" from this shift?")) return;
      send({action:"remove",key:k,index:i,name:e[i].n});
    }
  });

  document.addEventListener("submit",function(ev){
    var f=ev.target;
    if(!f.classList||!f.classList.contains("add")) return;
    ev.preventDefault();
    if(busy) return;
    var n=(f.n.value||"").trim();
    if(!n) return;
    send({action:"add",key:f.getAttribute("data-k"),name:n});
  });

  paint();
  load();
  setInterval(function(){
    if(document.visibilityState==="visible" && !busy && !openKey) load();
  },30000);
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="visible" && !busy && !openKey) load();
  });
})();
</script>
</body>
</html>
